<svg viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg">
    <!-- Grass Base -->
    <rect width="1000" height="1000" fill="#2e5a1c"/>
    
    <!-- Infield Dirt Circle -->
    <!-- Center at 500, 700 (Home plate area roughly at bottom center of this diagram? No, usually field view is diamond.) -->
    <!-- Let's assume standard broadcasting view: Home plate at bottom. -->
    
    <!-- Warning track / Outfield dirt -->
    <path d="M 100,250 Q 500,50 900,250 L 950,900 L 50,900 Z" fill="#2e5a1c" stroke="#4a2e18" stroke-width="0" />
    
    <!-- Foul Lines -->
    <line x1="500" y1="850" x2="100" y2="450" stroke="white" stroke-width="5"/>
    <line x1="500" y1="850" x2="900" y2="450" stroke="white" stroke-width="5"/>
    
    <!-- Infield Dirt (Diamond squared) -->
    <!-- Bases at roughly: Home(500, 850), 1B(700, 650), 2B(500, 450), 3B(300, 650) -->
    <path d="M 500,850 L 750,600 Q 800,550 750,500 L 500,250 L 250,500 Q 200,550 250,600 Z" fill="#8b5a2b" stroke="none" />
    
    <!-- Grass Infield (Diamond inside dirt) -->
    <rect x="420" y="570" width="160" height="160" transform="rotate(45 500 650)" fill="#2e5a1c" />
    
    <!-- Bases -->
    <rect x="495" y="845" width="10" height="10" fill="white" transform="rotate(45 500 850)" /> <!-- Home -->
    <rect x="735" y="610" width="15" height="15" fill="white" transform="rotate(45 742 617)" /> <!-- 1B -->
    <rect x="492" y="370" width="15" height="15" fill="white" transform="rotate(45 500 377)" /> <!-- 2B -->
    <rect x="250" y="610" width="15" height="15" fill="white" transform="rotate(45 257 617)" /> <!-- 3B -->

    <!-- Pitcher Mound -->
    <circle cx="500" cy="615" r="30" fill="#8b5a2b"/>
    <rect x="495" y="610" width="10" height="4" fill="white"/>

    <!-- Outfield Fence -->
    <path d="M 100,450 Q 500,50 900,450" fill="none" stroke="#facc15" stroke-width="5" stroke-dasharray="20,10"/>
</svg>
