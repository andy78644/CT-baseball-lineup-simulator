<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>台灣隊先發陣容預測 | Taiwan Baseball Lineup Selector</title>
    <meta name="description" content="打造你的夢幻台灣隊先發陣容！Premier12 / WBC 棒球陣容選擇器">

    <!-- Preconnect for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Google Fonts: Noto Sans TC (Chinese) + Fira fonts (English/Code) -->
    <!-- Prioritize Chinese font loading -->
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap"
        as="style">
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Toast Container for Notifications -->
    <div id="toastContainer" class="toast-container"></div>

    <div class="app-container">
        <header>
            <h1>台灣隊先發陣容預測</h1>
            <p>2024 Premier12 / WBC Dream Team Selector</p>
        </header>

        <main>
            <!-- User Info Section -->
            <section class="user-info card">
                <h2>
                    <!-- Baseball SVG Icon -->
                    <svg class="icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"></circle>
                        <path d="M4.93 4.93c4.08 4.08 4.08 10.69 0 14.14"></path>
                        <path d="M19.07 4.93c-4.08 4.08-4.08 10.69 0 14.14"></path>
                    </svg>
                    鍵盤教練資訊
                </h2>
                <div class="input-group">
                    <input type="text" id="coachName" placeholder="您的名字 / 鍵盤教練代號" required aria-label="鍵盤教練名稱">
                    <input type="email" id="coachEmail" placeholder="Email (簡易驗證用)" required aria-label="電子郵件">
                    <button id="searchBtn" class="secondary-btn" type="button" aria-label="搜尋或載入陣容">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 8px;">
                            <circle cx="11" cy="11" r="8"></circle>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                        </svg>
                        搜尋 / 載入
                    </button>
                </div>
            </section>

            <div class="workspace">
                <!-- Left Column: Roster -->
                <section class="roster-panel card">
                    <h2>
                        <!-- Users SVG Icon -->
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                            <circle cx="9" cy="7" r="4"></circle>
                            <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                            <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                        </svg>
                        球員名單
                    </h2>
                    <div class="tabs" role="tablist">
                        <button class="tab-btn active" data-type="pitchers" role="tab" aria-selected="true">投手</button>
                        <button class="tab-btn" data-type="catchers" role="tab" aria-selected="false">捕手</button>
                        <button class="tab-btn" data-type="infielders" role="tab" aria-selected="false">內野</button>
                        <button class="tab-btn" data-type="outfielders" role="tab" aria-selected="false">外野</button>
                    </div>
                    <div id="rosterList" class="roster-list" role="listbox" aria-label="球員列表">
                        <!-- Populated by JS -->
                    </div>
                </section>

                <!-- Center Column: Lineup Builder -->
                <section class="lineup-panel card">
                    <h2>
                        <!-- List SVG Icon -->
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="8" y1="6" x2="21" y2="6"></line>
                            <line x1="8" y1="12" x2="21" y2="12"></line>
                            <line x1="8" y1="18" x2="21" y2="18"></line>
                            <line x1="3" y1="6" x2="3.01" y2="6"></line>
                            <line x1="3" y1="12" x2="3.01" y2="12"></line>
                            <line x1="3" y1="18" x2="3.01" y2="18"></line>
                        </svg>
                        先發打序 & 投手
                    </h2>
                    <div class="batting-order">
                        <!-- 1-9 Batting Order -->
                        <!-- Slots are generated by JS to prevent duplication -->
                        <div id="battingSlots"></div>
                    </div>

                    <div class="pitcher-slots">
                        <h3>
                            <!-- Target SVG Icon for Pitchers -->
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                                style="vertical-align: middle; margin-right: 6px;">
                                <circle cx="12" cy="12" r="10"></circle>
                                <circle cx="12" cy="12" r="6"></circle>
                                <circle cx="12" cy="12" r="2"></circle>
                            </svg>
                            投手安排
                        </h3>
                        <div class="order-slot" data-slot="SP1_KR" tabindex="0">
                            <span class="slot-num">SP1(韓)</span>
                            <div class="slot-content">
                                <span class="placeholder">先發1 vs. 韓國</span>
                            </div>
                            <button class="clear-btn" hidden aria-label="清除選擇">×</button>
                        </div>
                        <div class="order-slot" data-slot="SP2_KR" tabindex="0">
                            <span class="slot-num">SP2(韓)</span>
                            <div class="slot-content">
                                <span class="placeholder">先發2 vs. 韓國</span>
                            </div>
                            <button class="clear-btn" hidden aria-label="清除選擇">×</button>
                        </div>
                        <div class="order-slot" data-slot="SP1_JP" tabindex="0">
                            <span class="slot-num">SP1(日)</span>
                            <div class="slot-content">
                                <span class="placeholder">先發1 vs. 日本</span>
                            </div>
                            <button class="clear-btn" hidden aria-label="清除選擇">×</button>
                        </div>
                        <div class="order-slot" data-slot="SP2_JP" tabindex="0">
                            <span class="slot-num">SP2(日)</span>
                            <div class="slot-content">
                                <span class="placeholder">先發2 vs. 日本</span>
                            </div>
                            <button class="clear-btn" hidden aria-label="清除選擇">×</button>
                        </div>
                        <div class="order-slot" data-slot="SP1_AU" tabindex="0">
                            <span class="slot-num">SP1(澳)</span>
                            <div class="slot-content">
                                <span class="placeholder">先發1 vs. 澳洲</span>
                            </div>
                            <button class="clear-btn" hidden aria-label="清除選擇">×</button>
                        </div>
                        <div class="order-slot" data-slot="SP2_AU" tabindex="0">
                            <span class="slot-num">SP2(澳)</span>
                            <div class="slot-content">
                                <span class="placeholder">先發2 vs. 澳洲</span>
                            </div>
                            <button class="clear-btn" hidden aria-label="清除選擇">×</button>
                        </div>
                        <div class="order-slot" data-slot="SP1_CZ" tabindex="0">
                            <span class="slot-num">SP1(捷)</span>
                            <div class="slot-content">
                                <span class="placeholder">先發1 vs. 捷克</span>
                            </div>
                            <button class="clear-btn" hidden aria-label="清除選擇">×</button>
                        </div>
                        <div class="order-slot" data-slot="SP2_CZ" tabindex="0">
                            <span class="slot-num">SP2(捷)</span>
                            <div class="slot-content">
                                <span class="placeholder">先發2 vs. 捷克</span>
                            </div>
                            <button class="clear-btn" hidden aria-label="清除選擇">×</button>
                        </div>
                    </div>

                    <div class="actions">
                        <button id="clearAllBtn" class="danger-btn" style="margin-right: auto; padding: 12px 20px;">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                                style="vertical-align: middle; margin-right: 6px;">
                                <polyline points="3 6 5 6 21 6"></polyline>
                                <path
                                    d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2">
                                </path>
                            </svg>
                            全部清空
                        </button>
                        <button id="submitBtn" class="primary-btn">
                            <!-- Check SVG Icon -->
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
                                style="vertical-align: middle; margin-right: 8px;">
                                <polyline points="20 6 9 17 4 12"></polyline>
                            </svg>
                            提交陣容
                        </button>
                    </div>
                </section>

                <!-- Right Column: Field View -->
                <section class="field-panel card">
                    <h2>
                        <!-- Map SVG Icon -->
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"></polygon>
                            <line x1="8" y1="2" x2="8" y2="18"></line>
                            <line x1="16" y1="6" x2="16" y2="22"></line>
                        </svg>
                        守備位置
                    </h2>
                    <div class="baseball-field">
                        <div class="field-grass"></div>
                        <div class="field-dirt"></div>
                        <!-- Positions -->
                        <div class="field-pos p-c" data-pos="C" tabindex="0"><span>C</span></div>
                        <div class="field-pos p-1b" data-pos="1B" tabindex="0"><span>1B</span></div>
                        <div class="field-pos p-2b" data-pos="2B" tabindex="0"><span>2B</span></div>
                        <div class="field-pos p-3b" data-pos="3B" tabindex="0"><span>3B</span></div>
                        <div class="field-pos p-ss" data-pos="SS" tabindex="0"><span>SS</span></div>
                        <div class="field-pos p-lf" data-pos="LF" tabindex="0"><span>LF</span></div>
                        <div class="field-pos p-cf" data-pos="CF" tabindex="0"><span>CF</span></div>
                        <div class="field-pos p-rf" data-pos="RF" tabindex="0"><span>RF</span></div>
                        <div class="field-pos p-dh" data-pos="DH" tabindex="0"><span>DH</span></div>
                        <div class="field-pos p-sp" data-pos="SP" tabindex="0"><span>SP</span></div>
                    </div>
                </section>
            </div>

            <!-- Share Buttons (Hidden by default) -->
            <div id="mainShareButtons" hidden>
                <button id="mainShareFieldBtn" class="share-btn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                    </svg>
                    複製守備圖
                </button>
                <button id="mainSaveFieldBtn" class="share-btn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"></path>
                        <polyline points="16 6 12 2 8 6"></polyline>
                        <line x1="12" y1="2" x2="12" y2="15"></line>
                    </svg>
                    儲存/分享守備圖
                </button>
                <button id="mainShareListBtn" class="share-btn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                        <polyline points="14 2 14 8 20 8"></polyline>
                        <line x1="16" y1="13" x2="8" y2="13"></line>
                        <line x1="16" y1="17" x2="8" y2="17"></line>
                        <polyline points="10 9 9 9 8 9"></polyline>
                    </svg>
                    複製打序表
                </button>
                <button id="mainSaveListBtn" class="share-btn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"></path>
                        <polyline points="16 6 12 2 8 6"></polyline>
                        <line x1="12" y1="2" x2="12" y2="15"></line>
                    </svg>
                    儲存/分享打序表
                </button>
            </div>

            <!-- History Section -->
            <section class="history-section card">
                <h2>
                    <!-- Clock SVG Icon -->
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"></circle>
                        <polyline points="12 6 12 12 16 14"></polyline>
                    </svg>
                    其他鍵盤教練的名單
                </h2>
                <div id="lineupHistory" class="history-grid">
                    <!-- Populated by JS -->
                </div>
            </section>

            <!-- Lineup Comparison Table -->
            <section class="comparison-section card">
                <h2>
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <line x1="8" y1="6" x2="21" y2="6"></line>
                        <line x1="8" y1="12" x2="21" y2="12"></line>
                        <line x1="8" y1="18" x2="21" y2="18"></line>
                        <line x1="3" y1="6" x2="3.01" y2="6"></line>
                        <line x1="3" y1="12" x2="3.01" y2="12"></line>
                    </svg>
                    所有教練陣容比較
                </h2>
                <div class="table-container">
                    <table id="lineupTable">
                        <thead>
                            <!-- Populated by JS -->
                        </thead>
                        <tbody>
                            <!-- Populated by JS -->
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <!-- Lineup Details Modal -->
    <div id="lineupModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div class="modal-content">
            <button class="close-modal" aria-label="關閉">&times;</button>
            <h2 id="modalTitle">陣容詳情</h2>
            <div id="modalBody" class="modal-body">
                <!-- Details injected here -->
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
